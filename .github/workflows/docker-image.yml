name: CI/CD ASP.NET Core + Docker

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📦 Checkout
      uses: actions/checkout@v3

    - name: 🔐 Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 🐳 Build & Push
      run: |
        docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/pwa:latest \
          -f Scanner/Dockerfile \
          .

        docker push ${{ secrets.DOCKER_USERNAME }}/pwa:latest
