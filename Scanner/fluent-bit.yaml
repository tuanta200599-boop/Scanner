apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  labels:
    k8s-app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1  #1s gửi 1 log
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/pods/default_*/*/*.log   #container mặc định của k8s
        Parser            cri           #parse format Docker/K8s
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On

    [FILTER] #chỉ lấy về json
        Name                parser
        Match               kube.*
        Key_Name            log
        Parser              json_parser
        Preserve_Key        On
        Reserve_Data        On

    [FILTER]
        Name    grep
        Match   kube.*
        Exclude log .*fluent-bit.* #Loại bỏ log của Fluent Bit

    [FILTER]
        Name    grep
        Match   kube.*
        Regex   log .*Scanner App.*   #chỉ lấy về Scanner App

    [OUTPUT]   #đẩy log tới đâu
        Name            es
        Match           *
        Host            host.docker.internal
        Port            9200
        Logstash_Format On
        Logstash_Prefix scanner-logs #tạo tiền tố cho log scanner-logs-
        Suppress_Type_Name On
        Generate_ID      On
        Replace_Dots     On
        tls              Off
        Buffer_Size      5M #băng thông 5m
        Retry_Limit     False

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name        json_parser
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    k8s-app: fluent-bit
spec:
  selector:
    matchLabels:
      k8s-app: fluent-bit
  template:
    metadata:
      labels:
        k8s-app: fluent-bit
    spec:
      serviceAccountName: fluent-bit-service-account
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:latest-debug
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: config
          mountPath: /fluent-bit/etc/
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: config
        configMap:
          name: fluent-bit-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit-service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
- kind: ServiceAccount
  name: fluent-bit-service-account
  namespace: default
